# 把弦谱挂到 https://你的域名/guitar/ 的 Nginx 片段
# 放进站点 server{} 内（宝塔面板可放在 vhost/nginx/extension/<域名>/ 下的独立文件里，
# 避免面板重写站点主配置时被覆盖）。
#
# Node 服务以 BASE_PATH=/guitar 启动，页面、接口、图片地址都带 /guitar 前缀，
# 因此 proxy_pass 末尾不能加斜杠，需要保留完整 URI。

location = /guitar {
    return 301 /guitar/;
}

location ^~ /guitar/ {
    proxy_pass http://127.0.0.1:8098;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /guitar;
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    # 上传大图时不落盘整包，直接透传
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 100m;
}
